<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Debrief — Tidning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1a1714; --dek:rgba(26,23,20,.66);
    --muted:rgba(26,23,20,.5); --faint:rgba(26,23,20,.34);
    --line:rgba(26,23,20,.13); --line-strong:rgba(26,23,20,.26);
    --accent:#d2331f; --accent-soft:rgba(210,51,31,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}

  /* type system */
  .grotesk{font-family:'Archivo','Inter',sans-serif;letter-spacing:-.018em;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .kicker{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.13em;
    font-size:10.5px;font-weight:600;color:var(--accent);}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--faint);}
  .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;}
  .dek{color:var(--dek);font-size:15px;line-height:1.5;}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  ::selection{background:var(--accent-soft);}

  /* layout — mobile first */
  .wrap{max-width:600px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom));}

  /* nameplate */
  .plate{padding:26px 0 16px;border-bottom:2.5px solid var(--ink);margin-bottom:2px;}
  .plate h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.04em;margin:0;line-height:.9;}
  .plate .rule{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}

  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;
    cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;}
  .card:active{transform:scale(.985);}
  @media(hover:hover){.card:hover{border-color:var(--line-strong);box-shadow:0 10px 26px -18px rgba(0,0,0,.35);}}

  .topline{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .topline .n{font-size:11px;}
  .topline .k{flex:1;min-width:0;}

  .head{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:-.022em;line-height:1.12;
    color:var(--ink);font-size:21px;margin:0 0 7px;}
  .head.sm{font-size:18px;}
  .head.lg{font-size:25px;}

  /* image */
  .photo{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:11px 0 6px;background:var(--bg);}
  .photo img{display:block;width:100%;height:100%;object-fit:cover;}
  .cap{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}

  /* footer */
  .foot{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);}
  .src{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .verb{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--accent);white-space:nowrap;}
  .save{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:transparent;
    color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
  .save:active{transform:scale(.9);}
  .save.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* why */
  .why{border-left:2px solid var(--accent);padding-left:10px;margin-top:11px;}
  .why .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
  .why p{margin:3px 0 0;font-size:13.5px;line-height:1.45;color:var(--dek);}

  /* type tag */
  .tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:2px 7px;border:1px solid var(--line-strong);border-radius:5px;color:var(--ink);}
  .tag.red{color:#fff;background:var(--accent);border-color:var(--accent);}

  /* media row (video/podcast/book/file) */
  .mrow{display:flex;gap:13px;}
  .thumb{flex:none;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .play span{width:34px;height:34px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;padding-left:2px;}
  .dur{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.78);color:#fff;font-family:'JetBrains Mono',monospace;font-size:9px;padding:1px 5px;border-radius:4px;}

  /* waveform */
  .wave{display:flex;align-items:flex-end;gap:1.5px;height:22px;}
  .wave i{flex:1;background:var(--accent);opacity:.45;border-radius:1px;animation:wv 1s ease-in-out infinite;}
  @keyframes wv{0%,100%{height:25%}50%{height:100%}}

  /* book cover */
  .book{position:relative;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:-4px 5px 14px -6px rgba(0,0,0,.4);
    background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:flex-end;padding:9px 9px 10px 12px;}
  .book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(0,0,0,.25);}

  /* file thumb */
  .filebox{flex:none;width:52px;height:66px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
  .filebox .corner{position:absolute;top:0;right:0;border-width:0 14px 14px 0;border-style:solid;border-color:transparent var(--bg) transparent transparent;}

  /* quote */
  .pull{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:14px 0;}
  .pull blockquote{font-family:'Archivo',sans-serif;font-weight:600;font-size:22px;line-height:1.26;margin:0;letter-spacing:-.02em;}
  .pull .qmark{color:var(--accent);font-size:30px;line-height:0;}

  /* stat */
  .bignum{font-family:'Archivo',sans-serif;font-weight:800;font-size:54px;line-height:.85;letter-spacing:-.04em;color:var(--accent);}

  /* reveal */
  .rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;}
  .rv.in{opacity:1;transform:none;}

  /* reader sheet */
  #rd{position:fixed;inset:0;z-index:60;display:none;}
  #rd.open{display:block;}
  #rd .scrim{position:absolute;inset:0;background:rgba(26,23,20,.4);opacity:0;transition:opacity .3s;}
  #rd.open .scrim{opacity:1;}
  #rd .sheet{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--bg);
    transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #rd.open .sheet{transform:none;}
  @media(min-width:601px){#rd .sheet{left:50%;transform:translate(-50%,100%);max-width:600px;border-left:1px solid var(--line);border-right:1px solid var(--line);}#rd.open .sheet{transform:translate(-50%,0);}}
  .rdbar{position:sticky;top:0;background:var(--bg);z-index:3;display:flex;align-items:center;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top));}
  .rdbar .x{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    border:1px solid var(--line-strong);border-radius:8px;padding:7px 12px;background:transparent;color:var(--ink);cursor:pointer;}
  .rdwrap{padding:24px 18px calc(70px + env(safe-area-inset-bottom));}
  .reading p{font-size:17px;line-height:1.62;color:var(--ink);margin:0 0 1.15rem;}
  .reading p.lead{font-size:19px;line-height:1.5;font-weight:500;}
  mark.hl{background:var(--accent-soft);border-bottom:1.5px solid var(--accent);padding:.04em .1em;}

  /* reader progress */
  #rdprog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0;transition:width .1s linear;}

  /* sections */
  .sec{display:flex;align-items:center;gap:11px;margin:32px 0 2px;}
  .sec-l{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);}
  .sec-rule{flex:1;height:1px;background:var(--line-strong);}
  .sec-c{flex:none;}
  .head.xl{font-size:28px;line-height:1.06;}

  /* related */
  .rel{margin-top:32px;border-top:2px solid var(--ink);padding-top:4px;}
  .rel-h{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);padding:12px 0 4px;}
  .rel-row{display:flex;gap:11px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .rel-row:active{opacity:.55;}
  .rel-t{flex:1;font-family:'Archivo',sans-serif;font-weight:600;font-size:15.5px;line-height:1.2;letter-spacing:-.012em;}

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);
    z-index:70;background:var(--ink);color:var(--bg);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    letter-spacing:.04em;padding:10px 16px;border-radius:10px;transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;gap:8px;align-items:center;}
  #toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="wrap">
  <header class="plate">
    <h1>Debrief</h1>
    <div class="rule">
      <span class="meta">TORS 29 MAJ 2026 · ED. 142</span>
      <span class="meta" style="color:var(--accent);">9 BRIEFER · 14 MIN</span>
    </div>
  </header>
  <div id="feed"></div>
  <div id="end"></div>
</div>

<div id="rd"><div class="scrim" onclick="closeRd()"></div><div class="sheet" id="sheet"><div id="rdbody"></div></div></div>
<div id="toast"></div>

<script>
/* ---------------- data ---------------- */
const IMG = {
  ai:'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=800&q=80',
  vid:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800&q=80',
};
const TYPES = {
  article:{tag:'Artikel',verb:'Läs →'}, textonly:{tag:'Analys',verb:'Läs →'},
  video:{tag:'Video',verb:'Se →'}, podcast:{tag:'Podd',verb:'Lyssna →'},
  book:{tag:'Bok',verb:'Läslista +'}, file:{tag:'PDF',verb:'Ladda ner ↓'},
  link:{tag:'Länk',verb:'Öppna ↗'}, quote:{tag:'Citat',verb:'Läs →'}, stat:{tag:'Siffra',verb:'Kontext →'},
};
const D = [
 {id:'a0',type:'article',img:IMG.ai,kicker:'AI · Marknad',source:'The Information',time:'5 min',must:true,lead:true,
  head:'OpenAI:s nya modell flyttar tyngdpunkten från chatt till agenter',
  dek:'Skiftet är inte en produktuppdatering — det är en omformulering av vem som gör jobbet.',
  why:'Mätetalet byts från "svar per fråga" till "uppgifter slutförda" — det förändrar prissättning och bemanning.',
  body:[{lead:true,t:'Det är lätt att avfärda gårdagens släpp som ännu en modell. Det vore ett misstag.'},
        {t:'Den verkliga nyheten är inte att modellen är smartare, utan att den är byggd för att agera självständigt över flera steg utan att en människa håller i varje moment.'},
        {t:'Den som vinner skiftet är inte den med störst modell, utan den som först gör agenterna pålitliga nog att lita på utan tillsyn.'}]},

 {id:'a1',type:'textonly',kicker:'Makro · Räntor',source:'Bloomberg',time:'3 min',must:true,
  head:'Riksbanken signalerar paus — men marknaden hör en sänkning',
  dek:'Tonen i protokollet var försiktig. Ändå prisade obligationsmarknaden snabbt in en sänkning före sommaren.',
  why:'Glappet mellan vad banken säger och vad marknaden tror styr din bolåneränta långt innan ett beslut tas.',
  body:[{lead:true,t:'Det handlar mindre om vad som sades och mer om vad som inte sades.'},
        {t:'Frånvaron av en tydlig signal tolkades som en öppning. Räntan på tioåringen föll direkt.'}]},

 {id:'a2',type:'video',img:IMG.vid,kicker:'Teknik',source:'Stratechery',time:'18 min',dur:'18:24',channel:'Ben Thompson',
  head:'Varför halvledar-kartan ritas om — och vad det betyder för Europa',
  dek:'Hur exportkontroller, kapacitet och efterfrågan möts under 2026.',
  why:'Halvledare är flaskhalsen för allt från AI till bilar. Vem som kontrollerar produktionen formar nästa decennium.'},

 {id:'a3',type:'podcast',kicker:'Ledarskap',source:'Lenny\'s Podcast',time:'52 min',dur:'52:10',show:'Lenny\'s Podcast',ep:'Avs. 218',
  head:'Bygg ett team som tänker i system, inte i uppgifter',
  dek:'En operativ chef om att gå från brandsläckning till struktur — och misstagen på vägen.',
  why:'Skalning misslyckas sällan på strategi, oftast på hur beslut delegeras. En konkret modell.'},

 {id:'a4',type:'book',kicker:'Läsning',source:'Penguin',time:'320 sid',author:'Morgan Housel',genre:'Ekonomi',c1:'#9c3322',c2:'#6e2417',
  head:'The Psychology of Money',
  dek:'Tidlösa lektioner om välstånd, girighet och lycka — varför beteende slår intelligens i pengar.',
  why:'Veckans mest delade titel. Korta fristående kapitel, lätt att läsa i bitar.'},

 {id:'a5',type:'file',kicker:'Rapport · Energi',source:'IEA',time:'48 sid',filetype:'PDF',filesize:'4,2 MB',pages:'48',
  fname:'iea-world-energy-outlook-2026.pdf',
  head:'World Energy Outlook 2026 — sammanfattning',
  dek:'Det globala energiskiftet i siffror: investeringar, kapacitet och var efterfrågan växer.',
  why:'Grunddatat bakom hälften av veckans energinyheter. Spara nu, läs på fredag.'},

 {id:'a6',type:'link',kicker:'Resurs',source:'arxiv.org',time:'extern',domain:'arxiv.org',
  head:'Originalstudien bakom veckans mest delade AI-tråd',
  dek:'Hela pappret, inte sammanfattningen. För dig som vill se metoden själv.',
  why:'De flesta delar tråden. Få läser källan. Den här gör skillnad i ett samtal.'},

 {id:'a7',type:'quote',kicker:'Veckans ord',source:'Jensen Huang, Nvidia',time:'1 min',
  head:'Du blir inte ersatt av en AI. Du blir ersatt av någon som använder AI.',
  dek:'Sagt på GTC. Spreds snabbt — inte för att det är nytt, utan för att det äntligen sas enkelt.',
  why:'Den korta versionen av hela årets debatt om arbete och automation.'},

 {id:'a8',type:'stat',kicker:'Siffran',source:'McKinsey',time:'1 min',big:'31%',unit:'av arbetstiden',
  head:'kan automatiseras med dagens teknik — inte morgondagens',
  dek:'Inte en framtidsprognos. Andelen bygger på verktyg som finns och används redan i dag.',
  why:'Skiftet är inte på väg. Det pågår. Frågan är bara hur snabbt organisationer anpassar sig.'},
];
const byId = id => D.find(x=>x.id===id);
let saved = new Set(['a4']);

/* ---------------- helpers ---------------- */
const esc = s => s;
function topline(a,i){
  return `<div class="topline"><span class="num n">${String(i+1).padStart(2,'0')}</span>
    <span class="kicker k">${a.kicker}</span><span class="tag">${TYPES[a.type].tag}</span></div>`;
}
function why(a){return `<div class="why"><div class="lbl">Varför</div><p>${a.why}</p></div>`;}
function foot(a){
  return `<div class="foot">
    <span class="src meta">${a.source} · ${a.time}</span>
    <span class="verb">${TYPES[a.type].verb}</span>
    <button class="save ${saved.has(a.id)?'on':''}" data-save="${a.id}" onclick="tog('${a.id}',event)"><span class="ic">${saved.has(a.id)?'★':'☆'}</span></button>
  </div>`;
}
function card(inner,a){return `<article class="card rv" onclick="openRd('${a.id}')">${inner}</article>`;}

/* ---------------- per-type cards ---------------- */
const C = {};
C.article = (a,i)=>card(topline(a,i)+
  `<h2 class="head ${a.lead?'xl':(a.must?'lg':'')}">${a.head}</h2>`+
  (a.img?`<div class="photo" style="aspect-ratio:${a.lead?'3/2':'16/9'};"><img src="${a.img}"></div>${a.lead?`<div class="cap">Foto · ${a.source}</div>`:''}`:'')+
  `<p class="dek ${a.lead?'clamp3':'clamp2'}">${a.dek}</p>`+(a.must?why(a):'')+foot(a),a);
C.textonly = (a,i)=>card(topline(a,i)+
  `<h2 class="head">${a.head}</h2><p class="dek clamp2">${a.dek}</p>`+why(a)+foot(a),a);
C.video = (a,i)=>card(topline(a,i)+
  `<div class="mrow"><div class="thumb" style="width:130px;aspect-ratio:16/9;"><img src="${a.img}" style="width:100%;height:100%;object-fit:cover;">
     <div class="play"><span>▶</span></div><span class="dur">${a.dur}</span></div>
   <div style="flex:1;min-width:0;"><h2 class="head sm">${a.head}</h2><span class="meta">${a.channel}</span></div></div>`+
  why(a)+foot(a),a);
C.podcast = (a,i)=>{const bars=Array.from({length:18}).map((_,k)=>`<i style="animation-delay:${(k%6)*.1}s"></i>`).join('');
  return card(topline(a,i)+
  `<div class="mrow"><div class="thumb" style="width:62px;height:62px;background:linear-gradient(135deg,#d2331f,#8a2114);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;">❍</div>
   <div style="flex:1;min-width:0;"><h2 class="head sm">${a.head}</h2>
     <div style="display:flex;align-items:center;gap:9px;margin-top:6px;"><span class="meta">${a.ep}</span><div class="wave" style="flex:1;max-width:120px;">${bars}</div><span class="meta">${a.dur}</span></div></div></div>`+
  why(a)+foot(a),a);};
C.book = (a,i)=>card(topline(a,i)+
  `<div class="mrow"><div class="book" style="width:54px;height:81px;--c1:${a.c1};--c2:${a.c2};"><span class="grotesk" style="color:#fff;font-size:10px;font-weight:700;line-height:1.05;">${a.head}</span></div>
   <div style="flex:1;min-width:0;"><h2 class="head sm">${a.head}</h2><span class="meta">${a.author} · ${a.genre}</span><p class="dek clamp2" style="margin-top:6px;font-size:13.5px;">${a.dek}</p></div></div>`+
  why(a)+foot(a),a);
C.file = (a,i)=>card(topline(a,i)+
  `<div class="mrow"><div class="filebox"><span class="corner"></span><span class="mono" style="background:var(--accent);color:#fff;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;">${a.filetype}</span></div>
   <div style="flex:1;min-width:0;"><h2 class="head sm">${a.head}</h2>
     <div class="mono" style="font-size:11px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.fname}</div>
     <div class="meta" style="margin-top:5px;">${a.filetype} · ${a.filesize} · ${a.pages} S</div></div></div>`+
  why(a)+foot(a),a);
C.link = (a,i)=>card(topline(a,i)+
  `<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px;"><span style="width:16px;height:16px;border-radius:4px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;">↗</span><span class="mono" style="font-size:11px;color:var(--muted);">${a.domain}</span></div>
   <h2 class="head sm">${a.head}</h2><p class="dek clamp2" style="margin-top:6px;">${a.dek}</p>`+
  why(a)+foot(a),a);
C.quote = (a,i)=>card(topline(a,i)+
  `<div class="pull"><blockquote><span class="qmark">“</span>${a.head}</blockquote></div>
   <div class="meta" style="margin-top:10px;">— ${a.source}</div>`+why(a)+foot(a),a);
C.stat = (a,i)=>card(topline(a,i)+
  `<div style="display:flex;align-items:baseline;gap:13px;"><div class="bignum">${a.big}</div>
   <div style="flex:1;"><div class="meta" style="margin-bottom:4px;">${a.unit}</div><h2 class="head sm" style="font-weight:600;">${a.head}</h2></div></div>`+
  why(a)+foot(a),a);

/* ---------------- sections ---------------- */
const SECTIONS = [
  {label:'Dagens ledare', ids:['a0']},
  {label:'Marknad & makro', ids:['a1','a8']},
  {label:'Lyssna & se', ids:['a2','a3']},
  {label:'Läslista & resurser', ids:['a4','a5','a6']},
  {label:'Veckans ord', ids:['a7']},
];

/* ---------------- render feed ---------------- */
function draw(){
  let n=0, html='';
  SECTIONS.forEach((sec,si)=>{
    if(si>0) html+=`<div class="sec"><span class="sec-l">${sec.label}</span><span class="sec-rule"></span><span class="num sec-c">§${si+1}</span></div>`;
    sec.ids.forEach(id=>{const a=byId(id); if(!a)return; html+=C[a.type](a,n); n++;});
  });
  document.getElementById('feed').innerHTML = html;
  document.getElementById('end').innerHTML =
    `<div style="text-align:center;padding:40px 0 10px;border-top:2px solid var(--ink);margin-top:18px;">
       <div class="grotesk" style="font-weight:700;font-size:20px;">Du är ikapp.</div>
       <div class="meta" style="margin-top:6px;">NÄSTA EDITION IMORGON 06:30</div>
       <div class="meta" style="margin-top:14px;color:var(--accent);">● 12 DAGAR I RAD</div>
     </div>`;
  sync(); observe();
}

/* ---------------- save ---------------- */
function tog(id,e){e.stopPropagation();
  if(saved.has(id)){saved.delete(id);toast('Borttaget');}else{saved.add(id);toast('Sparat ★');}
  sync();}
function sync(){document.querySelectorAll('[data-save]').forEach(b=>{
  const on=saved.has(b.getAttribute('data-save'));b.classList.toggle('on',on);b.querySelector('.ic').textContent=on?'★':'☆';});}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1600);}

/* ---------------- reveal ---------------- */
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in');}),{threshold:.08});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));}

/* ---------------- reader (type-aware) ---------------- */
function openRd(id){
  const a=byId(id);
  if(a.type==='link'){toast('Öppnar '+a.domain+' ↗');window.open('https://'+a.domain,'_blank');return;}
  document.getElementById('rdbody').innerHTML = (RD[a.type]||RD.article)(a);
  const r=document.getElementById('rd');r.classList.add('open');document.body.style.overflow='hidden';
  document.getElementById('sheet').scrollTop=0;sync();
}
function closeRd(){document.getElementById('rd').classList.remove('open');document.body.style.overflow='';}
function bar(a){return `<div class="rdbar"><button class="x" onclick="closeRd()">✕ Stäng</button>
  <span class="meta" style="margin-left:auto;">${a.source} · ${a.time}</span>
  <button class="save ${saved.has(a.id)?'on':''}" data-save="${a.id}" onclick="tog('${a.id}',event)"><span class="ic">${saved.has(a.id)?'★':'☆'}</span></button>
  <div id="rdprog"></div></div>`;}
function rdWhy(a){return `<div class="why" style="margin:0 0 24px;"><div class="lbl">Varför det spelar roll</div><p style="font-size:15px;">${a.why}</p></div>`;}
function related(a){
  const items=D.filter(x=>x.id!==a.id && x.type!=='quote' && x.type!=='stat').slice(0,3);
  if(!items.length) return '';
  return `<div class="rel"><div class="rel-h">Mer som detta</div>`+
    items.map(x=>`<div class="rel-row" onclick="openRd('${x.id}')">
      <span class="kicker" style="flex:none;width:64px;">${TYPES[x.type].tag}</span>
      <span class="rel-t">${x.head}</span>
      <span class="num" style="flex:none;font-size:11px;">${x.time}</span></div>`).join('')+`</div>`;
}

const RD={};
RD.article = a=>bar(a)+`<div class="rdwrap"><div class="topline"><span class="kicker">${a.kicker}</span><span class="tag">${TYPES[a.type].tag}</span></div>
  <h1 class="head lg" style="font-size:28px;line-height:1.08;margin:8px 0 16px;">${a.head}</h1>
  ${a.img?`<div class="photo" style="aspect-ratio:16/9;margin-bottom:4px;"><img src="${a.img}"></div><div class="cap">Foto · ${a.source}</div>`:''}
  ${rdWhy(a)}<div class="reading">${(a.body||[]).map(p=>`<p class="${p.lead?'lead':''}">${p.t}</p>`).join('')}</div>${related(a)}</div>`;
RD.textonly = RD.article;

RD.video = a=>bar(a)+`<div class="rdwrap" style="padding-top:18px;">
  <div style="aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;background:#000;margin-bottom:16px;">
    <img src="${a.img}" style="width:100%;height:100%;object-fit:cover;opacity:.6;">
    <div class="play"><span style="width:58px;height:58px;font-size:20px;">▶</span></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);"><div style="width:16%;height:100%;background:var(--accent);"></div></div></div>
  <div class="topline"><span class="kicker">${a.kicker}</span><span class="meta">${a.channel}</span></div>
  <h1 class="head lg" style="font-size:23px;margin:6px 0 12px;">${a.head}</h1><p class="dek" style="margin-bottom:20px;">${a.dek}</p>${rdWhy(a)}</div>`;

RD.podcast = a=>{const bars=Array.from({length:42}).map((_,k)=>`<i style="animation-delay:${(k%8)*.08}s"></i>`).join('');
  return bar(a)+`<div class="rdwrap" style="text-align:center;padding-top:30px;">
  <div style="width:170px;height:170px;margin:0 auto 18px;border-radius:14px;background:linear-gradient(135deg,#d2331f,#7a1d10);display:flex;align-items:center;justify-content:center;color:#fff;font-size:54px;box-shadow:0 16px 36px -14px rgba(0,0,0,.4);">❍</div>
  <div class="meta">${a.show} · ${a.ep}</div>
  <h1 class="head" style="font-size:21px;margin:8px 0 22px;">${a.head}</h1>
  <div class="wave" style="height:38px;margin-bottom:10px;">${bars}</div>
  <div class="meta" style="display:flex;justify-content:space-between;margin-bottom:20px;"><span>12:30</span><span>${a.dur}</span></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:26px;">
    <span class="mono" style="font-size:14px;color:var(--muted);">↺15</span>
    <span style="width:56px;height:56px;border-radius:99px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;padding-left:2px;">▶</span>
    <span class="mono" style="font-size:14px;color:var(--muted);">30↻</span></div>
  <div style="text-align:left;">${rdWhy(a)}</div></div>`;};

RD.book = a=>bar(a)+`<div class="rdwrap"><div style="display:flex;gap:18px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;">
  <div class="book" style="width:118px;height:177px;--c1:${a.c1};--c2:${a.c2};"><span class="grotesk" style="color:#fff;font-size:18px;font-weight:700;line-height:1.08;">${a.head}</span></div>
  <div style="flex:1;min-width:160px;"><div class="tag" style="display:inline-block;margin-bottom:8px;">${TYPES[a.type].tag}</div>
    <h1 class="head" style="font-size:22px;margin:0 0 4px;">${a.head}</h1>
    <div class="meta" style="margin-bottom:14px;">${a.author} · ${a.genre} · ${a.time}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="x" style="background:var(--accent);color:#fff;border-color:var(--accent);" onclick="tog('${a.id}',event);closeRd()">+ Läslista</button>
      <button class="x" onclick="toast('Öppnar handlare ↗')">Köp · 189 kr</button></div></div></div>
  <p class="reading" style="font-size:17px;">${a.dek}</p>${rdWhy(a)}</div>`;

RD.file = a=>bar(a)+`<div class="rdwrap"><div class="topline"><span class="kicker">${a.kicker}</span><span class="tag">${TYPES[a.type].tag}</span></div>
  <h1 class="head lg" style="font-size:24px;margin:8px 0 16px;">${a.head}</h1>
  <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px;">
    <div style="background:var(--bg);padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);">
      <span class="mono" style="background:var(--accent);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;">${a.filetype}</span>
      <span class="mono" style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.fname}</span>
      <span class="meta">${a.filesize}</span></div>
    <div style="aspect-ratio:1/1.3;background:#fff;padding:28px 26px;display:flex;flex-direction:column;gap:10px;">
      <div style="height:13px;width:68%;background:var(--line-strong);border-radius:2px;"></div>
      <div style="height:8px;width:100%;background:var(--line);border-radius:2px;"></div>
      <div style="height:8px;width:94%;background:var(--line);border-radius:2px;"></div>
      <div style="height:8px;width:88%;background:var(--line);border-radius:2px;margin-bottom:10px;"></div>
      <div style="height:8px;width:62%;background:var(--line);border-radius:2px;"></div>
      <div class="meta" style="margin-top:auto;text-align:center;">SIDA 1 AV ${a.pages}</div></div></div>
  <div style="display:flex;gap:8px;margin-bottom:18px;">
    <button class="x" style="background:var(--accent);color:#fff;border-color:var(--accent);" onclick="toast('Laddar ner ↓')">↓ Ladda ner · ${a.filesize}</button>
    <button class="x" onclick="toast('Förhandsgranskar')">Förhandsgranska</button></div>${rdWhy(a)}</div>`;

RD.quote = a=>bar(a)+`<div class="rdwrap" style="padding-top:46px;">
  <div class="qmark" style="color:var(--accent);font-family:Archivo;font-size:52px;line-height:0;">“</div>
  <blockquote class="grotesk" style="font-weight:600;font-size:27px;line-height:1.25;margin:14px 0 18px;letter-spacing:-.02em;">${a.head}</blockquote>
  <div class="meta">— ${a.source}</div><div style="margin-top:26px;">${rdWhy(a)}</div></div>`;

RD.stat = a=>bar(a)+`<div class="rdwrap" style="text-align:center;padding-top:40px;">
  <div class="bignum" style="font-size:88px;">${a.big}</div><div class="meta" style="margin:8px 0 24px;">${a.unit}</div>
  <h1 class="head" style="font-size:22px;margin:0 0 16px;">${a.head}</h1><p class="dek" style="font-size:16px;">${a.dek}</p>
  <div style="text-align:left;margin-top:24px;">${rdWhy(a)}</div></div>`;

/* highlight in reader */
document.getElementById('sheet').addEventListener('mouseup',()=>{const s=window.getSelection();if(s.toString().trim().length>4&&s.rangeCount){try{const r=s.getRangeAt(0),m=document.createElement('mark');m.className='hl';r.surroundContents(m);s.removeAllRanges();toast('Markerat ✎');}catch(e){}}});
document.getElementById('sheet').addEventListener('scroll',function(){const p=document.getElementById('rdprog');if(!p)return;const max=this.scrollHeight-this.clientHeight;p.style.width=(max>0?Math.min(100,this.scrollTop/max*100):0)+'%';},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRd();});

draw();
</script>
</body>
</html>
