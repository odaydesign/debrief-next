<!DOCTYPE html>
<html lang="sv" data-theme="ink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debrief — Edition v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="ink"]{
    --bg:#14110d; --surface:#1d1913; --surface-2:#26211a; --line:rgba(243,239,230,.10);
    --line-strong:rgba(243,239,230,.18); --text:#f3efe6; --dek:rgba(243,239,230,.74);
    --muted:rgba(243,239,230,.52); --faint:rgba(243,239,230,.34);
    --accent:#5fcf80; --ember:#e0a458; --rose:#e08a8a; --sky:#7bb8e0; --violet:#b69ae0;
    --hl:rgba(95,207,128,.22);
  }
  :root[data-theme="paper"]{
    --bg:#efe9dd; --surface:#f6f1e8; --surface-2:#ece4d6; --line:rgba(33,30,25,.12);
    --line-strong:rgba(33,30,25,.22); --text:#211e19; --dek:rgba(33,30,25,.74);
    --muted:rgba(33,30,25,.54); --faint:rgba(33,30,25,.36);
    --accent:#2e9e57; --ember:#b9772b; --rose:#b3514f; --sky:#3f76a8; --violet:#74519e;
    --hl:rgba(46,158,87,.20);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;margin:0;
    transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .headline{font-family:'Fraunces',Georgia,serif;letter-spacing:-.018em;text-wrap:balance;}
  .kicker{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:500;color:var(--accent);}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .meta{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;color:var(--muted);}
  .dek{color:var(--dek);} .muted{color:var(--muted);} .faint{color:var(--faint);}
  .reading p{font-family:'Fraunces',Georgia,serif;font-size:1.18rem;line-height:1.74;color:var(--text);margin:0 0 1.4rem;font-weight:340;text-wrap:pretty;}
  .reading p.lead{font-size:1.42rem;line-height:1.6;color:var(--text);}
  .reading p.lead::first-letter{initial-letter:2;font-weight:500;margin-right:.08em;color:var(--accent);-webkit-initial-letter:2;}
  mark.hl{background:var(--hl);color:var(--text);padding:.06em .12em;border-radius:2px;border-bottom:1.5px solid var(--accent);}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  ::selection{background:var(--hl);}
  .hairline{border-color:var(--line);}
  .surf{background:var(--surface);} .surf2{background:var(--surface-2);}

  /* scroll progress */
  #prog-top{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:90;transition:width .08s linear;}

  /* nav rail */
  .railitem{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;cursor:pointer;color:var(--muted);transition:.18s;font-size:14px;font-weight:500;}
  .railitem:hover{background:var(--surface-2);color:var(--text);}
  .railitem.active{background:var(--surface-2);color:var(--text);}
  .railitem.active .railglyph{color:var(--accent);}
  .railglyph{width:20px;text-align:center;font-size:16px;}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;position:relative;}
  .card:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:0 18px 40px -22px rgba(0,0,0,.6);}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1;transform:none;}
  .imgwrap{overflow:hidden;position:relative;}
  .imgwrap img{transition:transform 1.1s cubic-bezier(.2,.7,.2,1);width:100%;height:100%;object-fit:cover;display:block;}
  .card:hover .imgwrap img{transform:scale(1.05);}
  .card:active{transform:scale(.987);transition:transform .12s cubic-bezier(.2,.7,.2,1);}
  /* must-read accent spine */
  .card.must-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);z-index:2;}

  /* save button */
  .savebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:.18s;font-size:15px;}
  .savebtn:hover{border-color:var(--line-strong);color:var(--text);}
  .savebtn:active{transform:scale(.9);}
  .savebtn.on{background:var(--accent);border-color:var(--accent);color:#14110d;}
  .savebtn.pop .saveicon{display:inline-block;animation:savepop .42s cubic-bezier(.2,.8,.2,1);}
  @keyframes savepop{0%{transform:scale(1)}38%{transform:scale(1.42) rotate(-8deg)}100%{transform:scale(1)}}

  /* primary verb button */
  .verb{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:transparent;color:var(--text);transition:.18s;font-family:'Inter',sans-serif;}
  .verb:hover{background:var(--text);color:var(--bg);border-color:var(--text);}
  .verb.solid{background:var(--accent);color:#14110d;border-color:var(--accent);}
  .verb.solid:hover{filter:brightness(1.08);background:var(--accent);color:#14110d;}
  .verb:active{transform:scale(.95);}
  .verb.sm{padding:7px 13px;font-size:12px;border-radius:9px;}

  /* type chip */
  .tchip{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .tchip .dot{width:6px;height:6px;border-radius:99px;background:currentColor;}

  /* badge must-read */
  .must{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);}
  .must::before{content:"";width:5px;height:5px;border-radius:99px;background:var(--ember);}

  /* scroll-spy */
  #spy{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:3px;}
  .spydot{display:flex;align-items:center;gap:9px;cursor:pointer;justify-content:flex-end;color:var(--faint);transition:.2s;font-family:'JetBrains Mono',monospace;font-size:10px;}
  .spydot .bar{width:18px;height:2px;background:currentColor;border-radius:2px;transition:.2s;}
  .spydot .lbl{opacity:0;transform:translateX(6px);transition:.2s;max-width:0;overflow:hidden;white-space:nowrap;}
  .spydot:hover{color:var(--text);} .spydot:hover .lbl{opacity:1;transform:none;max-width:140px;}
  .spydot.on{color:var(--accent);} .spydot.on .bar{width:30px;}
  .spydot.on .lbl{opacity:1;transform:none;max-width:140px;}

  /* reader overlay */
  #reader{position:fixed;inset:0;z-index:80;display:none;}
  #reader.open{display:block;}
  #reader .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;transition:opacity .35s;}
  #reader.open .scrim{opacity:1;}
  #reader .sheet{position:absolute;left:0;right:0;bottom:0;top:54px;background:var(--bg);border-radius:26px 26px 0 0;border-top:1px solid var(--line-strong);box-shadow:0 -24px 60px -20px rgba(0,0,0,.55);
    transform:translateY(100%);transition:transform .55s cubic-bezier(.16,1,.3,1);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;will-change:transform;}
  #reader.open .sheet{transform:none;}
  #reader .sheet.dragging{transition:none;}
  #rprog{position:sticky;top:0;height:2px;background:var(--accent);width:0;z-index:6;transition:width .12s linear;}
  /* grab handle for swipe-to-close */
  #rgrab{display:flex;align-items:center;justify-content:center;height:26px;cursor:grab;}
  #rgrab .pill{width:40px;height:4px;border-radius:99px;background:var(--line-strong);transition:background .2s,width .2s;}
  #reader .sheet.dragging #rgrab .pill{background:var(--accent);width:56px;}

  /* toast */
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120%);z-index:95;background:var(--text);color:var(--bg);
    padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:9px;}
  #toast.show{transform:translateX(-50%) translateY(0);}

  /* command palette */
  #pal{position:fixed;inset:0;z-index:85;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;}
  #pal.open{display:flex;}
  #pal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);}
  #pal .box{position:relative;width:min(560px,92vw);background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.7);}
  #palin{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;padding:18px 20px;border-bottom:1px solid var(--line);font-family:'Inter',sans-serif;}
  .palrow{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;color:var(--dek);font-size:14px;}
  .palrow.sel,.palrow:hover{background:var(--surface-2);color:var(--text);}
  .palrow .pk{margin-left:auto;}

  /* waveform */
  .wave{display:flex;align-items:flex-end;gap:2px;height:34px;}
  .wave span{flex:1;background:var(--accent);opacity:.5;border-radius:2px;animation:wv 1.1s ease-in-out infinite;}
  @keyframes wv{0%,100%{height:24%}50%{height:100%}}

  /* book cover */
  .book{position:relative;aspect-ratio:2/3;border-radius:4px 7px 7px 4px;overflow:hidden;box-shadow:-7px 7px 22px -8px rgba(0,0,0,.6);
    background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:space-between;padding:16px 14px 16px 20px;}
  .book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.22);}
  .book::after{content:"";position:absolute;left:7px;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.14);}

  /* hide scrollbars on rail */
  .noscroll::-webkit-scrollbar{display:none;}
  .noscroll{-ms-overflow-style:none;scrollbar-width:none;}

  .tabpane{display:none;} .tabpane.show{display:block;}

  #spy{display:none !important;}

  /* app shell — feed scales back when the reader opens (matches main app) */
  #app{transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .5s cubic-bezier(.16,1,.3,1),border-radius .5s,filter .5s;transform-origin:top center;}
  #app.pushed{transform:scale(.965);opacity:.5;border-radius:26px;overflow:hidden;filter:saturate(.85);}

  /* sticky top bar */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;margin:0 -22px;padding:13px 22px 12px;background:var(--bg);border-bottom:1px solid var(--line);}
  .topbar .brand{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;letter-spacing:-.02em;}
  .topbar .brand small{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-left:9px;font-weight:400;}
  .topbar .streak{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--muted);margin-right:4px;}
  .ticon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;cursor:pointer;transition:.18s;}
  .ticon:active{transform:scale(.92);}

  /* bottom navigation — primary nav, all sizes */
  .mob-bar{display:flex;}
</style>
</head>
<body>
<div id="prog-top"></div>

<!-- ============ BOTTOM NAVIGATION (primary) ============ -->
<nav class="mob-bar" style="position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center;">
  <button data-nav="edition" onclick="showTab('edition')" class="mobtab" style="background:none;border:0;color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;"><span style="font-size:18px;">◆</span>EDITION</button>
  <button data-nav="typer" onclick="showTab('typer')" class="mobtab" style="background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;"><span style="font-size:18px;">⊞</span>TYPER</button>
  <button onclick="openPal()" class="mobtab" style="background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;"><span style="font-size:18px;">⌘</span>SÖK</button>
  <button data-nav="bib" onclick="showTab('bib')" class="mobtab" style="background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;position:relative;"><span style="font-size:18px;">❏</span>SPARAT<span id="mob-count" class="num" style="position:absolute;top:-4px;right:6px;background:var(--accent);color:#14110d;border-radius:99px;font-size:9px;padding:1px 5px;display:none;">0</span></button>
</nav>

<!-- ============ MAIN ============ -->
<main id="app" style="min-height:100vh;">
  <div style="max-width:680px;margin:0 auto;padding:0 22px 130px;">

    <!-- sticky top bar -->
    <header class="topbar">
      <span class="brand">Debrief<small>№142</small></span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="streak"><span style="color:var(--accent);">●</span> 12</span>
        <button class="ticon" onclick="toggleTheme()" aria-label="Byt tema" title="Byt tema">◐</button>
      </div>
    </header>

    <!-- ===== TAB: EDITION ===== -->
    <section id="tab-edition" class="tabpane show">
      <div id="masthead" style="padding:26px 0 26px;"></div>
      <div id="pick" style="margin-bottom:38px;"></div>
      <div id="briefs" style="display:flex;flex-direction:column;gap:20px;"></div>
      <div id="endcard" style="margin-top:46px;"></div>
    </section>

    <!-- ===== TAB: TYPER ===== -->
    <section id="tab-typer" class="tabpane">
      <div style="padding:52px 0 22px;">
        <div class="kicker">Designsystem</div>
        <h1 class="headline" style="font-size:2.4rem;font-weight:560;margin:10px 0 8px;line-height:1.05;">Varje typ, genomtänkt.</h1>
        <p class="dek" style="font-size:1.02rem;line-height:1.6;max-width:48ch;">Nio innehållstyper. Varje kort har sin egen struktur, sitt eget verb och sin egen läsvy — men talar samma språk.</p>
      </div>
      <div id="gallery" style="display:flex;flex-direction:column;gap:34px;"></div>
    </section>

    <!-- ===== TAB: BIBLIOTEK ===== -->
    <section id="tab-bib" class="tabpane">
      <div style="padding:52px 0 18px;">
        <div class="kicker">Ditt bibliotek</div>
        <h1 class="headline" style="font-size:2.4rem;font-weight:560;margin:10px 0 14px;line-height:1.05;">Sparat &amp; markerat</h1>
        <input id="libsearch" oninput="drawLib()" placeholder="Sök i biblioteket…" style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;color:var(--text);font-size:14px;outline:none;font-family:'Inter',sans-serif;">
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="libtab verb solid" data-lib="saved" onclick="setLib('saved')">Sparat</button>
          <button class="libtab verb" data-lib="marks" onclick="setLib('marks')">Markeringar</button>
          <button class="libtab verb" data-lib="notes" onclick="setLib('notes')">Anteckningar</button>
        </div>
      </div>
      <div id="libbody" style="margin-top:8px;"></div>
    </section>

  </div>
</main>

<!-- scroll-spy -->
<div id="spy"></div>

<!-- reader -->
<div id="reader"><div class="scrim" onclick="closeReader()"></div><div class="sheet" id="sheet"><div id="rprog"></div><div id="rgrab"><span class="pill"></span></div><div id="rbody"></div></div></div>

<!-- toast -->
<div id="toast"></div>

<!-- command palette -->
<div id="pal"><div class="scrim" onclick="closePal()"></div><div class="box"><input id="palin" placeholder="Sök briefer, hoppa, byt tema…" oninput="drawPal(this.value)"><div id="pallist"></div></div></div>

<script>
/* ============================================================
   DATA — every content type, deliberately shaped
   ============================================================ */
const IMG = {
  ai:   'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=900&q=80',
  rates:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=900&q=80',
  energy:'https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=900&q=80',
  city: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=900&q=80',
  vid:  'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=900&q=80',
};

const TYPE = {
  article:  {label:'Artikel',  verb:'Läs',            glyph:'¶',  color:'var(--accent)'},
  textonly: {label:'Analys',   verb:'Läs',            glyph:'“',  color:'var(--ember)'},
  video:    {label:'Video',    verb:'Spela',          glyph:'▶',  color:'var(--rose)'},
  podcast:  {label:'Podd',     verb:'Lyssna',         glyph:'❍',  color:'var(--violet)'},
  book:     {label:'Bok',      verb:'Läslista',       glyph:'❏',  color:'var(--ember)'},
  file:     {label:'PDF',      verb:'Ladda ner',      glyph:'⤓',  color:'var(--sky)'},
  link:     {label:'Länk',     verb:'Öppna',          glyph:'↗',  color:'var(--sky)'},
  quote:    {label:'Citat',    verb:'Läs',            glyph:'❝',  color:'var(--violet)'},
  stat:     {label:'Siffra',   verb:'Kontext',        glyph:'#',  color:'var(--accent)'},
};

const editorPick = {
  id:'p0', type:'article', must:true, img:IMG.ai,
  kicker:'AI · Marknad', source:'The Information', time:'5 min',
  head:'OpenAI:s nya modell flyttar tyngdpunkten från chatt till agenter',
  dek:'Skiftet är inte en produktuppdatering — det är en omformulering av vem som gör jobbet. Företag testar redan att lägga ut hela arbetsflöden.',
  why:'Om agenter tar över rutinarbete byts mätetalet från "svar per fråga" till "uppgifter slutförda" — det förändrar prissättning, bemanning och konkurrens.',
  body:[
    {lead:true,t:'Det som presenterades i går är lätt att avfärda som ännu en modellsläpp. Det vore ett misstag.'},
    {t:'Den verkliga nyheten är inte att modellen är smartare, utan att den är byggd för att agera självständigt över flera steg — boka, jämföra, sammanställa, leverera — utan att en människa håller i varje moment.'},
    {t:'Tre saker att hålla ögonen på: prissättning per slutförd uppgift snarare än per token, hur företag omorganiserar team kring "agent-handledare", och vilka regelverk som hinner ifatt.'},
    {t:'Den som vinner det här skiftet är inte den med störst modell, utan den som först gör agenterna pålitliga nog att lita på utan tillsyn.'},
  ],
};

const BR = [
  { id:'b1', type:'textonly', must:true,
    kicker:'Makro · Räntor', source:'Bloomberg', time:'3 min',
    head:'Riksbanken signalerar paus — men marknaden hör en sänkning',
    dek:'Tonen i protokollet var försiktig. Ändå prisade obligationsmarknaden snabbt in en sänkning före sommaren.',
    why:'Glappet mellan vad centralbanken säger och vad marknaden tror styr bolåneräntan långt innan något faktiskt beslut tas.',
    body:[{lead:true,t:'Det handlar mindre om vad som sades och mer om vad som inte sades.'},{t:'Frånvaron av en tydlig signal tolkades som en öppning. Räntan på tioåringen föll direkt.'},{t:'För hushåll med rörligt bolån är detta den signal som spelar störst roll de kommande tre månaderna.'}] },

  { id:'b2', type:'video', must:false, img:IMG.vid,
    kicker:'Teknik · Intervju', source:'Stratechery', time:'18 min', dur:'18:24', channel:'Ben Thompson',
    head:'Varför halvledar-kartan ritas om — och vad det betyder för Europa',
    dek:'En genomgång av hur exportkontroller, kapacitet och efterfrågan möts under 2026.',
    why:'Halvledare är flaskhalsen för allt från AI till bilar. Vem som kontrollerar produktionen formar nästa decennium.' },

  { id:'b3', type:'podcast', must:false,
    kicker:'Ledarskap', source:'Lenny\'s Podcast', time:'52 min', dur:'52:10', show:'Lenny\'s Podcast', ep:'Avsnitt 218',
    head:'Hur man bygger ett team som tänker i system, inte i uppgifter',
    dek:'En operativ chef om att gå från brandsläckning till struktur — och misstagen på vägen.',

function toggleSave(id, ev){
  if(ev){ ev.stopPropagation(); }
  const a = byId(id);
  const turningOn = !saved.has(id);
  if(saved.has(id)){ saved.delete(id); toast('Borttaget från bibliotek', '−'); }
  else { saved.add(id); toast('Sparat · '+TYPE[a.type].label, '★'); }
  syncSaves();
  if(turningOn){
    document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>{ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); setTimeout(()=>b.classList.remove('pop'),440); });
  }
  if(document.getElementById('tab-bib').classList.contains('show')) drawLib();
}
function syncSaves(){
  document.querySelectorAll('[data-save]').forEach(btn=>{
    const on = saved.has(btn.getAttribute('data-save'));
    btn.classList.toggle('on', on);
    const ic = btn.querySelector('.saveicon');
    if(ic) ic.textContent = on ? '★' : '☆';
  });
  const n = saved.size;
  const rc = document.getElementById('rail-count'); if(rc) rc.textContent = n;
  const mc = document.getElementById('mob-count'); if(mc){ mc.textContent=n; mc.style.display = n? 'block':'none'; }
}
function saveBtn(id){
  return `<button class="savebtn ${saved.has(id)?'on':''}" data-save="${id}" onclick="toggleSave('${id}',event)" title="Spara"><span class="saveicon">${saved.has(id)?'★':'☆'}</span></button>`;
}

function toast(msg, icon){

}

/* ============================================================
   SCROLL — progress, spy, reveal
   ============================================================ */
function buildSpy(){
  const items = [editorPick, ...BR];
  document.getElementById('spy').innerHTML = items.map((a,i)=>
    `<div class="spydot ${i===0?'on':''}" data-spy="${i}" onclick="jumpSpy(${i})"><span class="lbl">${TYPE[a.type].label}</span><span class="bar"></span></div>`
  ).join('');
}
function jumpSpy(i){
  const el = document.querySelector(`#tab-edition [data-spy="${i}"]`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}
let spyObs, revObs;
function initObservers(){
  // reveal
  revObs = new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');});},{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));
  // spy
  spyObs = new IntersectionObserver((es)=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const idx = e.target.getAttribute('data-spy');
        document.querySelectorAll('#spy .spydot').forEach(d=>d.classList.toggle('on', d.getAttribute('data-spy')===idx));
      }
    });
  },{rootMargin:'-45% 0px -45% 0px'});
  document.querySelectorAll('#tab-edition [data-spy]').forEach(el=>spyObs.observe(el));
}
window.addEventListener('scroll',()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('prog-top').style.width = (h>0? (window.scrollY/h*100):0)+'%';
});
document.getElementById('sheet').addEventListener('scroll',function(){
  const h = this.scrollHeight - this.clientHeight;
  document.getElementById('rprog').style.width = (h>0?(this.scrollTop/h*100):0)+'%';
});

/* ---- swipe UP or DOWN to close the reader sheet (matches main app) ---- */
(function(){
  const sheet=document.getElementById('sheet'), reader=document.getElementById('reader'), scrim=reader.querySelector('.scrim');
  let startY=0, dy=0, mode=null, topStart=false, botStart=false;
  const atTop = ()=> sheet.scrollTop<=0;
  const atBottom = ()=> sheet.scrollTop + sheet.clientHeight >= sheet.scrollHeight - 1;
  function reset(){ sheet.classList.remove('dragging'); sheet.style.transform=''; scrim.style.opacity=''; mode=null; dy=0; }
  function doClose(){
    sheet.classList.remove('dragging');
    sheet.style.transform='translateY(100%)'; scrim.style.opacity='0';
    document.getElementById('app').classList.remove('pushed');
    if(navigator.vibrate){ try{navigator.vibrate(10);}catch(e){} }
    setTimeout(()=>{ reader.classList.remove('open'); document.body.style.overflow=''; sheet.style.transform=''; scrim.style.opacity=''; },480);
    mode=null; dy=0;
  }
  sheet.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    startY=e.touches[0].clientY; dy=0; mode=null; topStart=atTop(); botStart=atBottom();
  },{passive:true});
  sheet.addEventListener('touchmove',e=>{
    dy=e.touches[0].clientY-startY;
    if(mode===null){
      if(dy>4 && topStart) mode='down';
      else if(dy<-4 && botStart) mode='up';
      else return;
      sheet.classList.add('dragging');
    }
    const h=sheet.clientHeight||window.innerHeight;
    if(mode==='down'){
      if(sheet.scrollTop>0){ reset(); return; }
      e.preventDefault();
      sheet.style.transform=`translateY(${Math.max(0,dy)}px)`;
      scrim.style.opacity=Math.max(0,1-dy/h*1.25);
    } else if(mode==='up'){
      e.preventDefault();
      sheet.style.transform=`translateY(${Math.min(0,dy)*0.45}px)`;   // rubber-band upward
      scrim.style.opacity=Math.max(.45,1-(-dy)/h);
    }
  },{passive:false});
  sheet.addEventListener('touchend',()=>{
    if(!mode) return;
    const h=sheet.clientHeight||window.innerHeight;
    const closeDown = mode==='down' && dy>Math.min(150,h*0.2);
    const closeUp   = mode==='up'   && (-dy)>100;
    if(closeDown||closeUp) doClose(); else reset();
  });
  sheet.addEventListener('touchcancel',reset);
})();

/* ============================================================

   ============================================================ */
document.getElementById('sheet').addEventListener('mouseup',()=>{
  const sel = window.getSelection(); const txt = sel.toString().trim();
  if(txt.length>4 && sel.rangeCount){
    try{
      const r = sel.getRangeAt(0); const m = document.createElement('mark'); m.className='hl';
      r.surroundContents(m); sel.removeAllRanges(); toast('Markerat','✎');
    }catch(e){ /* cross-node selection */ }
  }
});

function setLib(t){ libTab=t; document.querySelectorAll('.libtab').forEach(b=>b.classList.toggle('solid', b.getAttribute('data-lib')===t)); drawLib(); }
function drawLib(){
  const q = (document.getElementById('libsearch').value||'').toLowerCase();
  const body = document.getElementById('libbody'); let html='';
  if(libTab==='saved'){
    const items = ALL.filter(a=>saved.has(a.id) && (a.head.toLowerCase().includes(q)||a.dek.toLowerCase().includes(q)));
    html = items.length? items.map(a=>libRow(a)).join('')
      : `<div class="dek" style="text-align:center;padding:50px 0;">Inget sparat ännu. Tryck ★ på ett kort.</div>`;
  } else if(libTab==='marks'){
    html = `<div class="dek" style="padding:18px 0;line-height:1.6;">Markeringar du gör i läsvyn samlas här.<br><span class="meta">Markera text i en öppen brief för att testa.</span></div>`;
  } else {
    const ids = Object.keys(notes);
    html = ids.length? ids.map(id=>{const a=byId(id);return `<div class="card" style="padding:16px;margin-bottom:12px;"><div class="meta" style="margin-bottom:6px;">${a?a.source:''} · anteckning</div><p style="margin:0 0 8px;font-family:'Fraunces',serif;font-size:1.05rem;">${notes[id]}</p><div class="dek" style="font-size:.85rem;">på: ${a?a.head:''}</div></div>`;}).join('')
      : `<div class="dek" style="text-align:center;padding:50px 0;">Inga anteckningar än.</div>`;
  }
  body.innerHTML = html; syncSaves();
}
function libRow(a){
  return `<div class="card" style="padding:14px 16px;margin-bottom:12px;display:flex;gap:13px;align-items:center;cursor:pointer;" onclick="openItem('${a.id}')">
     <span style="flex:none;color:${TYPE[a.type].color};font-size:14px;width:20px;text-align:center;">${TYPE[a.type].glyph}</span>
     <div style="flex:1;min-width:0;">
       <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">${chip(a.type)}</div>
       <div class="headline" style="font-size:1.02rem;font-weight:520;line-height:1.2;">${a.head}</div>
       <div class="meta" style="margin-top:3px;">${a.source} · ${a.time}</div>

}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
const PAL = [
  {k:'→',label:'Gå till Edition',act:()=>showTab('edition')},
  {k:'→',label:'Gå till Typer',act:()=>showTab('typer')},
  {k:'→',label:'Gå till Bibliotek',act:()=>showTab('bib')},
  {k:'◐',label:'Byt tema (ljust/mörkt)',act:()=>toggleTheme()},
  {k:'↑',label:'Till toppen',act:()=>window.scrollTo({top:0,behavior:'smooth'})},
];
let palSel=0, palResults=[];
function openPal(){ document.getElementById('pal').classList.add('open'); const i=document.getElementById('palin'); i.value=''; drawPal(''); setTimeout(()=>i.focus(),30); }
function closePal(){ document.getElementById('pal').classList.remove('open'); }
function drawPal(q){
  q=(q||'').toLowerCase();
  const cmds = PAL.filter(p=>p.label.toLowerCase().includes(q)).map(p=>({...p,kind:'cmd'}));
  const arts = ALL.filter(a=>a.head.toLowerCase().includes(q)||a.dek.toLowerCase().includes(q)).slice(0,5)
    .map(a=>({k:TYPE[a.type].glyph,label:a.head,act:()=>{closePal();openItem(a.id);},kind:'art'}));
  palResults = q? [...cmds,...arts] : [...PAL.map(p=>({...p,kind:'cmd'}))];
  palSel=0; renderPal();
}
function renderPal(){
  document.getElementById('pallist').innerHTML = palResults.map((r,i)=>
    `<div class="palrow ${i===palSel?'sel':''}" onclick="palResults[${i}].act()"><span style="color:var(--accent);width:18px;text-align:center;">${r.k}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.label}</span><span class="pk meta">${r.kind==='art'?'öppna':'gå'}</span></div>`
  ).join('') || `<div class="palrow muted">Inga träffar</div>`;
}

/* ============================================================
   THEME · TABS · KEYBOARD
   ============================================================ */
function toggleTheme(){
  theme = theme==='ink'?'paper':'ink';
  document.documentElement.setAttribute('data-theme',theme);
  const tl = document.getElementById('theme-label'); if(tl) tl.textContent = theme==='ink'?'Ljust läge':'Mörkt läge';
}
function showTab(name){
  ['edition','typer','bib'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('show', t===name);
  });
  document.querySelectorAll('[data-nav]').forEach(el=>{
    const on = el.getAttribute('data-nav')===name;
    el.classList.toggle('active', on);
    if(el.classList.contains('mobtab')) el.style.color = on?'var(--accent)':'var(--muted)';
  });
  document.getElementById('spy').style.display = (name==='edition')?'flex':'none';
  if(name==='typer') drawGallery();
  if(name==='bib') drawLib();
  window.scrollTo({top:0});
}
let focusIdx=-1;
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return;}
  if(document.getElementById('pal').classList.contains('open')){
    if(e.key==='Escape')closePal();
    if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palResults.length-1);renderPal();}
    if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);renderPal();}
    if(e.key==='Enter'&&palResults[palSel])palResults[palSel].act();
    return;
  }
  if(e.key==='Escape'){closeReader();return;}
});

/* ============================================================
   INIT
   ============================================================ */
drawMast(); drawPick(); drawBriefs(); drawEnd(); initObservers(); syncSaves();
