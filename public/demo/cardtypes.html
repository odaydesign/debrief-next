<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#26231f">
<title>Debrief — Korttyper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#26231f; --surface:#2f2b27; --card:#322e29; --ink:#f3efe6; --dek:rgba(243,239,230,.66);
    --muted:rgba(243,239,230,.5); --faint:rgba(243,239,230,.34);
    --line:rgba(243,239,230,.14); --line-strong:rgba(243,239,230,.26);
    --accent:#50c878; --accent-ink:#11241a; --accent-soft:rgba(80,200,120,.14);
    --red:#e2563f; --violet:#9a7bd0; --sky:#5aa9e6; --amber:#e0a800;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;padding:26px 16px 120px;}
  .kicker{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;font-weight:600;color:var(--accent);}
  .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums;}
  h1.t{font-family:'Fraunces',serif;font-weight:600;font-size:2rem;line-height:1.06;margin:6px 0 4px;}
  .sub{color:var(--dek);font-size:14px;line-height:1.55;margin:0 0 24px;}
  .seclabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:26px 2px 10px;}

  /* shared card chrome */
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px;
    transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;cursor:pointer;}
  @media(hover:hover){.card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 20px 50px -26px rgba(0,0,0,.6);}}
  .pad{padding:16px 17px 15px;display:flex;flex-direction:column;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink);}
  .chip i{width:6px;height:6px;border-radius:99px;background:var(--accent);display:inline-block;}
  .topline{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .head{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;line-height:1.16;font-size:1.32rem;margin:0 0 7px;color:var(--ink);}
  .dek{color:var(--dek);font-size:14px;line-height:1.5;margin:0;}
  .foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .foot .src{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .save{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;}
  .btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .imgwrap{width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:12px;background:#0003;}
  .imgwrap img{display:block;width:100%;height:100%;object-fit:cover;}

  /* ── video ── */
  .vthumb{position:relative;aspect-ratio:16/9;}
  .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .vplay span{width:52px;height:52px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;padding-left:3px;}
  .vdur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:5px;}
  .vnoimg{aspect-ratio:16/9;border-radius:12px;margin-top:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    background:radial-gradient(120% 120% at 50% 0%, rgba(226,86,63,.22), transparent 70%), var(--surface);border:1px solid var(--line);}
  .vnoimg .tri{width:46px;height:46px;border-radius:99px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;padding-left:3px;}

  /* ── book ── */
  .bookrow{display:flex;gap:16px;align-items:flex-start;}
  .book{flex:none;width:88px;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;position:relative;overflow:hidden;
    box-shadow:-6px 7px 20px -8px rgba(0,0,0,.6);background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:flex-end;padding:10px 9px 11px 13px;}
  .book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(0,0,0,.28);}
  .book .bt{font-family:'Fraunces',serif;color:#fff;font-weight:600;font-size:12px;line-height:1.1;}
  .book .ba{font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.7);font-size:7.5px;letter-spacing:.06em;margin-bottom:4px;}

  /* ── quote ── */
  .quote{position:relative;padding:6px 2px 2px;}
  .quote .mark{font-family:'Fraunces',serif;color:var(--accent);font-size:52px;line-height:0;height:24px;display:block;}
  .quote blockquote{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:1.5rem;line-height:1.32;margin:8px 0 0;letter-spacing:-.01em;}

  /* ── pdf/file ── */
  .filerow{display:flex;gap:14px;align-items:center;}
  .filebox{flex:none;width:56px;height:70px;border-radius:7px;background:var(--surface);border:1px solid var(--line-strong);position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;}
  .filebox::after{content:"";position:absolute;top:0;right:0;border-width:0 15px 15px 0;border-style:solid;border-color:transparent var(--card) transparent transparent;}
  .filebox .ext{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#fff;background:var(--red);padding:1px 5px;border-radius:3px;}
  .fname{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ── link ── */
  .linkrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .linkrow .ic{width:18px;height:18px;border-radius:5px;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .domain{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}

  /* ── stat ── */
  .bignum{font-family:'Fraunces',serif;font-weight:600;font-size:3.4rem;line-height:.9;letter-spacing:-.03em;color:var(--accent);}
  .statrow{display:flex;align-items:baseline;gap:14px;}

  /* ── podcast ── */
  .pcover{flex:none;width:66px;height:66px;border-radius:13px;background:linear-gradient(135deg,var(--violet),#5a4a7a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);}
  .wave{display:flex;align-items:flex-end;gap:2px;height:22px;flex:1;max-width:150px;}
  .wave i{flex:1;background:var(--violet);opacity:.55;border-radius:1px;animation:wv 1.1s ease-in-out infinite;}
  @keyframes wv{0%,100%{height:25%}50%{height:100%}}
  .pplay{width:30px;height:30px;border-radius:99px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;padding-left:2px;flex:none;}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Designsystem · Korttyper</p>
  <h1 class="t">Ett kort för varje typ</h1>
  <p class="sub">Samma redaktionella system — men varje innehållstyp får sin egen layout. Flera fungerar helt utan bild (citat, bok, PDF, siffra, länk).</p>
  <div id="feed"></div>
</div>

<script>
const IMG = {
  ai:'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=900&q=80',
  vid:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=900&q=80',
};
const foot = (src, verb) => `<div class="foot"><span class="src meta">${src}</span>${verb?`<button class="btn" onclick="event.stopPropagation()">${verb}</button>`:''}<button class="save" onclick="event.stopPropagation()">☆</button></div>`;
const chip = (label, color) => `<span class="chip"><i style="background:${color||'var(--accent)'}"></i>${label}</span>`;

const CARDS = [
  // ARTICLE with image
  {label:'Artikel · med bild', html: c=>`<div class="pad">
    <div class="topline">${chip('Artikel')}</div>
    <h2 class="head">OpenAI:s nya modell flyttar tyngdpunkten till agenter</h2>
    <p class="dek">Skiftet är inte en produktuppdatering — det är en omformulering av vem som gör jobbet.</p>
    ${foot('The Information · 5 min','Läs')}
    <div class="imgwrap" style="aspect-ratio:16/10;"><img src="${IMG.ai}"></div></div>`},

  // ARTICLE no image
  {label:'Artikel · utan bild', html: c=>`<div class="pad">
    <div class="topline">${chip('Analys')}</div>
    <h2 class="head">Riksbanken signalerar paus — men marknaden hör en sänkning</h2>
    <p class="dek">Tonen i protokollet var försiktig. Ändå prisade obligationsmarknaden snabbt in en sänkning före sommaren. Glappet mellan vad banken säger och vad marknaden tror styr din bolåneränta.</p>
    ${foot('Bloomberg · 3 min','Läs')}</div>`},

  // VIDEO / YOUTUBE with thumb
  {label:'Video · YouTube', html: c=>`<div class="pad">
    <div class="topline">${chip('Video', 'var(--red)')}<span class="meta">Ben Thompson</span></div>
    <h2 class="head">Varför halvledar-kartan ritas om — och vad det betyder</h2>
    <p class="dek">Hur exportkontroller, kapacitet och efterfrågan möts under 2026.</p>
    ${foot('Stratechery · 18 min','Spela')}
    <div class="imgwrap vthumb"><img src="${IMG.vid}"><div class="vplay"><span>▶</span></div><span class="vdur">18:24</span></div></div>`},

  // VIDEO no image
  {label:'Video · utan bild', html: c=>`<div class="pad">
    <div class="topline">${chip('Video', 'var(--red)')}<span class="meta">Nvidia GTC</span></div>
    <h2 class="head">Keynoten på tjugo minuter — det som faktiskt var nytt</h2>
    <div class="vnoimg"><div class="tri">▶</div><span class="meta">Spela · 21:40</span></div>
    ${foot('YouTube','Spela')}</div>`},

  // BOOK (CSS cover, no real image)
  {label:'Bok', html: c=>`<div class="pad">
    <div class="topline">${chip('Bok', 'var(--amber)')}</div>
    <div class="bookrow">
      <div class="book" style="--c1:#9c3322;--c2:#6e2417;"><span class="ba">HOUSEL</span><span class="bt">The Psychology of Money</span></div>
      <div style="flex:1;min-width:0;">
        <h2 class="head" style="font-size:1.18rem;">The Psychology of Money</h2>
        <div class="meta" style="margin:2px 0 8px;">Morgan Housel · Ekonomi · 320 sid</div>
        <p class="dek" style="font-size:13.5px;">Tidlösa lektioner om välstånd, girighet och lycka — varför beteende slår intelligens.</p>
        <div style="display:flex;gap:8px;margin-top:12px;"><button class="btn solid" onclick="event.stopPropagation()">+ Läslista</button><button class="btn" onclick="event.stopPropagation()">Köp</button></div>
      </div></div>
    ${foot('Penguin','')}</div>`},

  // QUOTE (no image)
  {label:'Citat', html: c=>`<div class="pad">
    <div class="topline">${chip('Citat', 'var(--violet)')}</div>
    <div class="quote"><span class="mark">“</span><blockquote>Du blir inte ersatt av en AI. Du blir ersatt av någon som använder AI.</blockquote></div>
    ${foot('Jensen Huang, Nvidia','')}</div>`},

  // PDF / FILE (no image)
  {label:'PDF · fil', html: c=>`<div class="pad">
    <div class="topline">${chip('PDF', 'var(--red)')}</div>
    <h2 class="head" style="font-size:1.18rem;">World Energy Outlook 2026 — sammanfattning</h2>
    <div class="filerow" style="margin-top:11px;">
      <div class="filebox"><span class="ext">PDF</span></div>
      <div style="flex:1;min-width:0;">
        <div class="fname">iea-world-energy-outlook-2026.pdf</div>
        <div class="meta" style="margin-top:5px;">PDF · 4,2 MB · 48 sidor</div>
        <button class="btn solid" style="margin-top:10px;" onclick="event.stopPropagation()">↓ Ladda ner</button>
      </div></div>
    ${foot('IEA','')}</div>`},

  // LINK (no image)
  {label:'Länk', html: c=>`<div class="pad">
    <div class="linkrow"><span class="ic">↗</span><span class="domain">arxiv.org</span>${chip('Länk', 'var(--sky)')}</div>
    <h2 class="head" style="font-size:1.2rem;">Originalstudien bakom veckans mest delade AI-tråd</h2>
    <p class="dek">Hela pappret, inte sammanfattningen. För dig som vill se metoden själv.</p>
    ${foot('arxiv.org · extern','Öppna ↗')}</div>`},

  // STAT / NUMBER (no image)
  {label:'Siffra', html: c=>`<div class="pad">
    <div class="topline">${chip('Siffra')}</div>
    <div class="statrow"><div class="bignum">31%</div>
      <div style="flex:1;"><div class="meta" style="margin-bottom:4px;">av arbetstiden</div>
        <h2 class="head" style="font-size:1.05rem;font-weight:500;">kan automatiseras med dagens teknik — inte morgondagens</h2></div></div>
    <p class="dek" style="margin-top:12px;">Inte en prognos. Andelen bygger på verktyg som finns och används redan i dag.</p>
    ${foot('McKinsey','Kontext')}</div>`},

  // PODCAST (no image)
  {label:'Podd', html: c=>{const bars=Array.from({length:16}).map((_,k)=>`<i style="animation-delay:${(k%6)*.1}s"></i>`).join('');
    return `<div class="pad">
    <div class="topline">${chip('Podd', 'var(--violet)')}<span class="meta">Avs. 218</span></div>
    <h2 class="head" style="font-size:1.18rem;">Bygg ett team som tänker i system, inte i uppgifter</h2>
    <div class="filerow" style="margin-top:12px;gap:13px;">
      <div class="pcover">❍</div>
      <div style="flex:1;display:flex;align-items:center;gap:11px;"><span class="pplay">▶</span><div class="wave">${bars}</div><span class="meta">52:10</span></div>
    </div>
    ${foot("Lenny's Podcast",'Lyssna')}</div>`;}},
];

document.getElementById('feed').innerHTML = CARDS.map(c =>
  `<div class="seclabel">${c.label}</div><article class="card">${c.html(c)}</article>`
).join('');
</script>
</body>
</html>
