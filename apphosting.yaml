# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# Env vars marked NEXT_PUBLIC_* are bundled into the client by Next.js
# and are intentionally public — same values live in .env.local for
# local dev. Data lives in Firestore + Storage (project debrief-3ef06),
# read directly via the Firebase web SDK (see lib/firebase.js, lib/db.js).

env:
  # Firebase config (project debrief-3ef06). Public client config, used for
  # Auth + Firestore + Storage.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCBg2bK_PpPDT1gUc2FUBLUvF5wYzpxyaQ
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: debrief-3ef06.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: debrief-3ef06
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: debrief-3ef06.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1020404599093"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1020404599093:web:bc3beca3912cd7c6bd647c
    availability:
      - BUILD
      - RUNTIME

  # Optional: override the daily-summary model (default openai/gpt-4o-mini).
  - variable: OPENROUTER_MODEL
    value: openai/gpt-4o-mini
    availability:
      - RUNTIME

  # ── Daily-summary LLM key (OpenRouter, OpenAI-compatible) ──────────────────
  # DISABLED until the secret exists — App Hosting fails a rollout if it
  # references a missing secret. To enable the AI daily summary:
  #   1) npx firebase-tools apphosting:secrets:set openrouter-api-key   (paste the key)
  #   2) Uncomment the block below and redeploy.
  # - variable: OPENROUTER_API_KEY
  #   secret: openrouter-api-key
  #   availability:
  #     - RUNTIME
